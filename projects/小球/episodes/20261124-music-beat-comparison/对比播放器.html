<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小球音乐节拍 A/B 对照</title>
<style>
body{margin:0;background:#101318;color:#edf1f7;font:16px system-ui,sans-serif}main{max-width:860px;margin:auto;padding:24px}h1{font-size:23px}p{line-height:1.7;color:#bac5d4}button{background:#29313e;color:white;border:1px solid #526177;border-radius:9px;padding:12px 16px;margin:0 8px 12px 0;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#275bc5;border-color:#8bb1ff}video{display:block;width:auto;max-width:100%;height:65vh;margin:12px auto;background:#000}.status{font-size:14px;color:#91b6ff}small{line-height:1.6;color:#bac5d4}
</style>
<main><h1>小球音乐节拍 A/B 对照</h1>
<p>同一画面、配乐与穿层音效，只比较音乐渐强的开始时机。切换 A/B 会保持当前播放位置。</p>
<button id="a" aria-pressed="true">A · 进度渐强</button><button id="b" aria-pressed="false">B · 拍点渐强</button><button id="ending">从 28 秒对比结尾</button>
<div class="status" id="status">当前：A · 进度渐强</div>
<video id="player" controls playsinline preload="metadata" src="video/A_进度渐强.mp4"></video>
<small>A 达到既有进度节点就开始平滑渐强；B 达到节点后等到下一个估计拍点。碰撞与穿层发声时刻不变；不变速、不自动转调。拍点估计不代表小节第一拍。此页为对照样片，未替换正式流程。</small></main>
<script>
const player=document.getElementById('player'),status=document.getElementById('status');
let selected='a',generation=0;
async function select(key){
 if(key===selected)return;
 const ticket=++generation,time=player.currentTime,playing=!player.paused;
 selected=key;
 for(const k of ['a','b'])document.getElementById(k).setAttribute('aria-pressed',String(k===key));
 const name=key==='a'?'A_进度渐强':'B_拍点渐强';
 status.textContent='当前：'+name.replace('_',' · ');
 player.pause();player.src='video/'+name+'.mp4';
 player.addEventListener('loadedmetadata',()=>{if(ticket!==generation)return;player.currentTime=Math.min(time,player.duration);if(playing)player.play().catch(()=>{});},{once:true});
 player.load();
}
document.getElementById('a').onclick=()=>select('a');document.getElementById('b').onclick=()=>select('b');
document.getElementById('ending').onclick=()=>{player.currentTime=28;player.play().catch(()=>{});};
</script></html>
