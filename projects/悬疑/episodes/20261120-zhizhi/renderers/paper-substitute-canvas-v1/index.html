<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#050609;overflow:hidden}canvas{display:block;width:1080px;height:1920px}</style></head><body><canvas id="frame" width="1080" height="1920"></canvas><script>
const c=document.querySelector('#frame'),x=c.getContext('2d'),W=1080,H=1920,TAU=Math.PI*2;
function e(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}function cl(v,a=0,b=1){return Math.max(a,Math.min(b,v))}
function poly(p,f,s='#17151a',w=7){x.beginPath();p.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.closePath();x.fillStyle=f;x.fill();x.strokeStyle=s;x.lineWidth=w;x.stroke()}function line(p,s='#17151a',w=8){x.beginPath();p.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.strokeStyle=s;x.lineWidth=w;x.lineCap='round';x.lineJoin='round';x.stroke()}function el(a,b,rx,ry,f,s='#17151a',w=7){x.beginPath();x.ellipse(a,b,rx,ry,0,0,TAU);x.fillStyle=f;x.fill();x.strokeStyle=s;x.lineWidth=w;x.stroke()}
function room(door=0){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#11151c');g.addColorStop(1,'#050609');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#20252d';x.fillRect(0,1160,W,760);x.fillStyle='#292c31';x.fillRect(0,1160,W,14);x.fillStyle='#181b21';x.fillRect(84,240,912,920);x.strokeStyle='#363c44';x.lineWidth=5;x.strokeRect(84,240,912,920);x.fillStyle='#282d34';x.fillRect(130,330,820,520);x.fillStyle='#0d121a';x.fillRect(160,365,760,450);x.fillStyle='#4b4036';x.fillRect(130,780,820,42);x.fillStyle='#625345';x.fillRect(170,815,740,35);x.fillStyle='#0e1725';x.fillRect(720,350,190,330);x.strokeStyle='#515966';x.lineWidth=8;x.strokeRect(720,350,190,330);line([[815,350],[815,680]],'#515966',6);line([[720,515],[910,515]],'#515966',6);x.fillStyle='#323841';x.fillRect(115,1065,850,130);x.fillStyle='#66717d';x.fillRect(130,1190,820,260);x.fillStyle='#8794a0';x.fillRect(160,1130,350,110);x.fillStyle='#b1b8bd';x.fillRect(165,1140,330,80);x.fillStyle='#5a4434';x.fillRect(725,1010,180,34);line([[750,1044],[735,1160]],'#3b2c25',14);line([[880,1044],[900,1160]],'#3b2c25',14);if(door){x.fillStyle='#a8845e';x.fillRect(700,260,270,900);x.fillStyle='#1a1518';x.fillRect(735,295,200,830);x.fillStyle=`rgba(225,203,157,${.6*door})`;x.fillRect(520,300,215,830)}}
function paper(px,py,sc=1,tilt=0,ink=0,arm=0){x.save();x.translate(px,py);x.scale(sc,sc);x.rotate(tilt);poly([[-42,-170],[-4,-170],[-12,0],[-56,0]],'#ead9bd');poly([[4,-170],[42,-170],[56,0],[12,0]],'#ead9bd');line([[-35,-95],[-8,-72],[25,-105]],'#7a5b3e',9);poly([[-70,-390],[70,-390],[88,-165],[42,-120],[-42,-120],[-88,-165]],'#b94d4b');poly([[-70,-390],[0,-348],[70,-390],[54,-285],[0,-250],[-54,-285]],'#2f796f');line([[-35,-310],[0,-270],[35,-310]],'#e7c99d',7);let l=[[-62,-340],[-105,-240-70*arm],[-112,-145-60*arm]],r=[[62,-340],[105,-250-40*arm],[116,-150-30*arm]];line(l,'#ead9bd',34);line(r,'#ead9bd',34);line(l,'#6b5039',5);line(r,'#6b5039',5);poly([[-72,-560],[0,-610],[72,-560],[58,-405],[0,-370],[-58,-405]],'#f0dfc1');x.fillStyle='#d64f4b';x.beginPath();x.arc(-42,-440,18,0,TAU);x.arc(42,-440,18,0,TAU);x.fill();el(-25,-490,8,12,'#17151a','#17151a',1);el(25,-490,8,12,'#17151a','#17151a',1);line([[0,-610],[0,-370]],'#76583e',7);if(ink)line([[22,-486],[22,-486+80*ink]],'#17151a',5);x.restore()}
function uncle(px,py,sc=.8){x.save();x.translate(px,py);x.scale(sc,sc);el(0,-250,55,62,'#b99f8d');x.fillStyle='#353a40';x.fillRect(-62,-190,124,220);line([[-38,-160],[-70,40]],'#353a40',28);line([[38,-160],[70,40]],'#353a40',28);line([[-56,-130],[-105,10]],'#b99f8d',24);line([[56,-130],[105,10]],'#b99f8d',24);x.restore()}
function funeral(){x.fillStyle='#17151b';x.fillRect(0,0,W,H);x.fillStyle='#332f37';x.fillRect(0,1300,W,620);x.fillStyle='#4b4650';x.fillRect(170,1180,740,140);x.fillStyle='#b9b0a0';x.fillRect(220,1050,640,130);x.fillStyle='#7d3131';x.fillRect(300,970,480,80);for(let i=0;i<5;i++)el(180+i*170,900-(i%2)*45,28,60,'#d5c7ad','#241f24',5);uncle(820,1090);x.fillStyle='#ddd4c4';x.font='bold 34px sans-serif';x.textAlign='center';x.fillText('奶奶出殡后的夜晚',540,170);x.font='24px sans-serif';x.fillStyle='#9e9a9a';x.fillText('老屋 · 只剩“我”和二叔',540,215)}
function draw(t){let s=Math.min(15,Math.floor(t/4)),q=(t%4)/4;x.clearRect(0,0,W,H);if(s===0){funeral();return}room(s>=13?cl(q*2):0);if(s===1){uncle(820,1110);paper(815,1004,.55);x.fillStyle='#b8a58f';x.font='28px sans-serif';x.textAlign='center';x.fillText('45 厘米 · 纸替',815,830)}else if(s===2){paper(815,1004,.55);x.fillStyle='#b8a58f';x.font='26px sans-serif';x.textAlign='center';x.fillText('八字轻的人，夜里放纸替挡一劫',540,160)}else if(s===3){paper(815,1004,.55);x.fillStyle='#d3bf9c';x.fillRect(922,650,26,120);x.fillStyle='#19161a';x.fillRect(900,765,52,24)}else if(s===4){paper(815,1004,.55);x.fillStyle=`rgba(243,201,128,${.35+.25*Math.sin(q*TAU)})`;x.beginPath();x.arc(610,1040,180,0,TAU);x.fill()}else if(s===5){paper(815,1004,.55);x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,W,H)}else if(s===6){paper(815,1004,.55);x.globalAlpha=e(q);paper(570,1125,.55,Math.sin(q*Math.PI)*.06);x.globalAlpha=1}else if(s===7){paper(570,1125,.55,0,.35);x.fillStyle='rgba(20,20,25,.55)';x.fillRect(0,0,W,H)}else if(s===8){paper(570,1125,.55,0,cl(q*1.5));x.fillStyle='#b8a58f';x.font='24px sans-serif';x.textAlign='center';x.fillText('墨水沿白纸脸颊滑下',540,160)}else if(s===9){paper(470,1140,.55,0,1);x.fillStyle='#151217';x.beginPath();x.arc(440,1235,10,0,TAU);x.fill()}else if(s===10){paper(470,1140,.55,e(q)*.3,0,e(q));x.fillStyle='#b8a58f';x.font='25px sans-serif';x.textAlign='center';x.fillText('竹篾在纸衣下轻轻磕响',540,160)}else if(s===11){paper(470,1140,.55);x.fillStyle='#d3bf9c';x.fillRect(922,650,26,120);x.fillStyle='#19161a';x.fillRect(900,765,52,24)}else if(s===12){paper(470,1140,.55);x.fillStyle='#a8845e';x.fillRect(700,260,270,900);x.fillStyle='#1a1518';x.fillRect(735,295,200,830);x.fillStyle=`rgba(225,203,157,${e(q)*.55})`;x.fillRect(520,300,210*e(q),830)}else if(s===13){paper(470,1140,.55);x.fillStyle='#a8845e';x.fillRect(700,260,270,900);x.fillStyle='#1a1518';x.fillRect(735,295,200,830);x.globalAlpha=e(q);uncle(825,1080);x.globalAlpha=1}else if(s===14){x.fillStyle='#151116';x.fillRect(0,0,W,H);x.fillStyle='#a8845e';x.fillRect(700,260,270,900);x.fillStyle='#1a1518';x.fillRect(735,295,200,830);x.save();x.translate(540,1160);x.scale(.34,.34);paper(0,0);x.restore();x.fillStyle='#d7d0c0';x.font='28px sans-serif';x.textAlign='center';x.fillText('我的手，已经不是人的手',540,160)}else{x.fillStyle='#151116';x.fillRect(0,0,W,H);x.fillStyle='#a8845e';x.fillRect(700,260,270,900);x.fillStyle='#1a1518';x.fillRect(735,295,200,830);x.save();x.translate(420,1200);x.scale(.42,.42);line([[-35,-50],[-35,20]],'#ead9bd',34);line([[35,-50],[35,20]],'#ead9bd',34);line([[-35,-50],[-10,-95]],'#76583e',7);line([[35,-50],[10,-95]],'#76583e',7);x.restore();x.fillStyle='#b8a58f';x.font='30px sans-serif';x.textAlign='center';x.fillText('门外传来我的声音。',540,160);x.font='24px sans-serif';x.fillText('脚步越走越远',540,205)}}window.renderFrame=f=>draw(f/24);draw(0);
</script></body></html>
